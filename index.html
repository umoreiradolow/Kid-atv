<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Trilha das Letras | Antes de conhecer o kit</title>
<meta name="description" content="Responda 3 perguntas rápidas e conheça a Trilha das Letras: kit de alfabetização com 2.500 atividades em 5 apostilas e 6 bônus."/>
<meta name="theme-color" content="#DD5230"/>
<link rel="icon" href="favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link rel="preload" as="image" href="imagens/quiz-kit.jpg"/>
<style>
  :root{--coral:#dd5230;--ink:#121b29;--muted:#4f5661;--cream:#f7efe4;--green:#00a63e;--pink:#f43f5e;--violet:#8b5cf6}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    font-family:Nunito,system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(110% 55% at 0% 0%,#ffe8e8 0%,rgba(255,232,232,0) 60%),radial-gradient(110% 55% at 100% 100%,#fbedd1 0%,rgba(251,237,209,0) 60%),#fdfcf8}
  .quiz{width:100%;max-width:440px;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 22px 55px rgba(115,91,35,.16),0 0 0 1px rgba(221,82,48,.08)}
  .media{aspect-ratio:4/3;overflow:hidden;background:var(--cream);max-height:320px;transition:max-height .45s ease,opacity .3s ease}
  .media img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0%}
  .media.is-hidden{max-height:0;opacity:0}
  .body{padding:22px 22px 24px;text-align:center}
  .eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--coral)}
  .brand{margin:6px 0 0;font-family:Fredoka,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.5px;color:#315f60}
  .brand span{color:var(--coral)}
  .sub{margin:6px 0 0;font-size:15px;color:var(--muted)}
  .progress{display:flex;align-items:center;gap:12px;margin:20px 0 6px}
  .track{flex:1;height:8px;border-radius:99px;background:#f1e7da;overflow:hidden}
  .fill{height:100%;width:33.3%;border-radius:99px;background:linear-gradient(90deg,#f5c761,var(--coral));transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .count{font-size:13px;font-weight:800;color:#8a8f97;min-width:28px;text-align:right}
  .step{animation:in .38s cubic-bezier(.2,.8,.2,1) both}
  .step.is-leaving{animation:out .22s ease both}
  @keyframes in{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(-22px)}}
  .q{margin:16px 0;font-family:Fredoka,sans-serif;font-weight:600;font-size:23px;line-height:1.22;color:var(--ink)}
  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;background:#fff;color:var(--ink);
    border:2px solid #f1e3d3;border-radius:16px;font:800 16px/1.3 Nunito,sans-serif;text-align:left;cursor:pointer;
    transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
  .opt:nth-child(1) .ico{background:#fff0e9}.opt:nth-child(2) .ico{background:#f3edff}.opt:nth-child(3) .ico{background:#ebfff3}.opt:nth-child(4) .ico{background:#fff0f5}
  .ico{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px}
  .opt:active{transform:scale(.985)}
  .opt.is-picked{background:#fff6f1;border-color:var(--coral);box-shadow:0 6px 16px rgba(221,82,48,.18)}
  @media (hover:hover){.opt:hover{border-color:#f5b49f;background:#fffaf6}}
  .skip{display:inline-block;margin-top:18px;font-size:14px;color:#7a808a;text-decoration:underline;text-underline-offset:3px}
  /* resultado */
  .check{width:62px;height:62px;margin:4px auto 14px;border-radius:50%;display:grid;place-items:center;background:#ebfff3;color:var(--green);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .check svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  .r-title{margin:0;font-family:Fredoka,sans-serif;font-weight:700;font-size:25px;line-height:1.2;color:var(--ink)}
  .r-title em{font-style:normal;color:var(--coral)}
  .r-text{margin:10px 0 0;font-size:16px;line-height:1.55;color:var(--muted)}
  .thanks{margin:18px 0 0;font-size:15px;font-weight:800}
  .coupon{position:relative;margin:14px auto 8px;padding:16px 18px;border:2px dashed #f5a623;border-radius:18px;background:linear-gradient(135deg,#fff8e1,#ffe9b8);box-shadow:0 10px 24px rgba(245,166,35,.22);animation:pop .55s .15s cubic-bezier(.2,1.4,.4,1) both}
  .coupon::before,.coupon::after{content:"";position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff}
  .coupon::before{left:-11px}.coupon::after{right:-11px}
  .c-label{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a45a00}
  .c-value{margin:2px 0;font-family:Fredoka,sans-serif;font-weight:700;font-size:34px;line-height:1.1;color:var(--coral)}
  .c-sub{margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a45a00}
  .c-pct{display:inline-block;padding:2px 8px;margin-right:4px;border-radius:7px;background:var(--green);color:#fff;letter-spacing:.06em}
  .auto{display:inline-flex;align-items:center;gap:6px;margin:10px 0 16px;padding:6px 12px;border-radius:99px;background:#ebfff3;color:#0c7a35;font-size:13px;font-weight:800}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:16px 18px;border-radius:999px;background:var(--green);color:#fff;
    font:800 17px/1.3 Nunito,sans-serif;text-decoration:none;box-shadow:0 6px 0 #087a31,0 12px 22px rgba(0,166,62,.28);animation:pulse 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
  .cta:active{transform:translateY(2px);box-shadow:0 3px 0 #087a31}
  @keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.02)}}
  @media (prefers-reduced-motion:reduce){.step,.step.is-leaving,.check,.coupon,.cta{animation:none}.fill,.media{transition:none}}
</style>

<body>
<main class="quiz" aria-live="polite">
  <div class="media" id="media"><img src="imagens/quiz-kit.jpg" width="760" height="760" alt="Kit Trilha das Letras com cinco apostilas de alfabetização"/></div>
  <div class="body">
    <div id="head">
      <p class="eyebrow">Antes de conhecer o kit</p>
      <p class="brand">trilha <span>das letras</span></p>
      <p class="sub">Responda 3 perguntas rápidas.</p>
      <div class="progress" aria-hidden="true"><div class="track"><div class="fill" id="fill"></div></div><span class="count" id="count">1/3</span></div>
    </div>
    <div id="stage"></div>
    <a class="skip" id="skip" href="oferta.html">Quero conhecer a Trilha das Letras agora</a>
  </div>
</main>

<template id="tpl-result">
  <div class="step">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1 class="r-title" id="r-title"></h1>
    <p class="r-text" id="r-text"></p>
    <p class="thanks">Obrigado por responder! Liberamos para você:</p>
    <div class="coupon">
      <p class="c-label">Cupom liberado</p>
      <p class="c-value">R$ 26 de desconto</p>
      <p class="c-sub"><span class="c-pct">57% OFF</span> no kit completo + 6 bônus</p>
    </div>
    <p class="auto">✅ Aplicado automaticamente</p>
    <a class="cta" id="go" href="oferta.html">Ver o kit com meu desconto <span aria-hidden="true">→</span></a>
  </div>
</template>

<script>
  // 3 perguntas. Qualquer combinação leva à mesma página; as respostas só
  // personalizam o resultado e o topo da página (parâmetros "fase" e "foco").
  var STEPS = [
    { key: 'para', q: 'Para quem seria a Trilha das Letras?', opts: [
      { v: 'filho',  e: '👦', t: 'Para o meu filho' },
      { v: 'filha',  e: '👧', t: 'Para a minha filha' },
      { v: 'varios', e: '👨‍👩‍👧‍👦', t: 'Para mais de uma criança' },
      { v: 'alunos', e: '🍎', t: 'Para os meus alunos' } ] },
    { key: 'foco', q: 'O que mais preocupa você na leitura hoje?', opts: [
      { v: 'letras',  e: '🔤', t: 'Ainda confunde as letras' },
      { v: 'silabas', e: '🧩', t: 'Não consegue juntar as sílabas' },
      { v: 'leitura', e: '📖', t: 'Lê devagar ou sem entender' },
      { v: 'tarefa',  e: '😣', t: 'A tarefa vira choro e estresse' } ] },
    { key: 'fase', q: 'Em qual fase a criança está agora?', opts: [
      { v: 'inicio',   e: '🌱', t: 'Está conhecendo as letras' },
      { v: 'silabico', e: '✏️', t: 'Já junta algumas sílabas' },
      { v: 'palavras', e: '🧒', t: 'Lê palavras, com dificuldade' },
      { v: 'reforco',  e: '⭐', t: 'Já lê, quero reforçar' } ] }
  ];
  var FASE_TITLE = {
    inicio:   'A Trilha das Letras tem atividades para <em>quem está começando</em>.',
    silabico: 'A Trilha das Letras tem atividades para <em>quem já junta sílabas</em>.',
    palavras: 'A Trilha das Letras tem atividades para <em>ler com mais confiança</em>.',
    reforco:  'A Trilha das Letras tem atividades para <em>ir ainda mais longe</em>.'
  };
  var FOCO_TEXT = {
    letras:  'Com atividades visuais de vogais, letras e sons, a criança aprende a reconhecer cada letra brincando, em poucos minutos por dia.',
    silabas: 'Passo a passo, a criança junta os sons, forma sílabas e descobre como as palavras nascem, com atividades leves e coloridas.',
    leitura: 'Palavras, frases e pequenos textos em sequência ajudam a criança a ler com mais calma e a entender o que leu.',
    tarefa:  'Atividades curtas e lúdicas transformam o momento da tarefa em descoberta, sem pressão e no ritmo da criança.'
  };

  var answers = {}, i = 0;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  // Leva UTMs e parâmetros do anúncio para a página de oferta
  function offerUrl(withCoupon) {
    var p = new URLSearchParams(location.search);
    if (withCoupon) p.set('origem', 'quiz');
    Object.keys(answers).forEach(function (k) { p.set(k, answers[k]); });
    var qs = p.toString();
    return 'oferta.html' + (qs ? '?' + qs : '');
  }
  function track(name, data) { try { if (window.fbq) fbq('trackCustom', name, data || {}); } catch (e) {} }

  function renderStep() {
    var s = STEPS[i];
    $('fill').style.width = ((i + 1) / STEPS.length * 100) + '%';
    $('count').textContent = (i + 1) + '/' + STEPS.length;
    $('media').classList.toggle('is-hidden', i > 0);
    var el = document.createElement('div');
    el.className = 'step';
    el.innerHTML = '<h2 class="q">' + (i + 1) + '. ' + s.q + '</h2><div class="opts" role="list"></div>';
    var list = el.querySelector('.opts');
    s.opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.setAttribute('role', 'listitem');
      b.innerHTML = '<span class="ico" aria-hidden="true">' + o.e + '</span><span>' + o.t + '</span>';
      b.addEventListener('click', function () { pick(s.key, o.v, b); }, { once: true });
      list.appendChild(b);
    });
    swap(el);
  }

  function pick(key, value, btn) {
    answers[key] = value;
    btn.classList.add('is-picked');
    stage.querySelectorAll('.opt').forEach(function (b) { b.disabled = true; });
    if (navigator.vibrate) navigator.vibrate(12);
    if (i === 0) track('QuizIniciado');
    setTimeout(function () { i++; i < STEPS.length ? renderStep() : renderResult(); }, 320);
  }

  function renderResult() {
    $('head').style.display = 'none';
    $('skip').style.display = 'none';
    var el = $('tpl-result').content.firstElementChild.cloneNode(true);
    el.querySelector('#r-title').innerHTML = FASE_TITLE[answers.fase] || FASE_TITLE.inicio;
    el.querySelector('#r-text').textContent = FOCO_TEXT[answers.foco] || FOCO_TEXT.letras;
    el.querySelector('#go').href = offerUrl(true);
    swap(el);
    track('QuizConcluido', answers);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function swap(el) {
    var old = stage.firstElementChild;
    if (!old) { stage.appendChild(el); return; }
    old.classList.add('is-leaving');
    setTimeout(function () { old.remove(); stage.appendChild(el); }, 200);
  }

  $('skip').href = offerUrl(false);
  renderStep();
</script>
